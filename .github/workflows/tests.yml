name: Python tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run regression suite
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m unittest -v > test-results.txt 2>&1
          status=$?
          echo "$status" > test-exit-code.txt
          cat test-results.txt
          exit 0
      - name: Upload regression transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-results
          path: |
            test-results.txt
            test-exit-code.txt
      - name: Enforce regression result
        shell: bash
        run: test "$(cat test-exit-code.txt)" -eq 0
